<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapSolve AI - Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Theme Toggle -->
    <button id="themeToggle" class="theme-toggle" title="Toggle light/dark mode">🌙</button>

    <div class="container">
        <header>
            <h1>🎓 SnapSolve AI</h1>
            <p class="subtitle">Exam-Style Answers Powered by Gemma 4</p>
        </header>

        <div class="main-layout">
            <!-- Sidebar - History -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <h3>📋 History</h3>
                    <button id="clearHistoryBtn" class="btn-small">Clear</button>
                </div>
                <div class="history-list" id="historyList">
                    <p class="empty-state">No questions yet</p>
                </div>
            </aside>

            <!-- Main Content -->
            <main class="main-content">
                <!-- Input Card -->
                <div class="card">
                    <div class="input-row">
                        <select id="subject" class="select-small">
                            <option value="general">General</option>
                            <option value="math">Math</option>
                            <option value="physics">Physics</option>
                            <option value="english">English</option>
                        </select>
                    </div>
                    <textarea 
                        id="question" 
                        placeholder="Type your question here..."
                        rows="3"
                    ></textarea>
                    <div class="button-group">
                        <button id="askBtn" class="btn btn-primary">
                            🔍 Detailed Answer
                        </button>
                        <button id="shortBtn" class="btn btn-secondary">
                            ⚡ Short Answer
                        </button>
                    </div>
                </div>

                <!-- Loading -->
                <div id="loading" class="card loading-card" style="display: none;">
                    <div class="spinner"></div>
                    <p>Generating answer...</p>
                </div>

                <!-- Answer -->
                <div id="result" class="card result-card" style="display: none;">
                    <div class="answer-content" id="answerContent"></div>
                    
                    <!-- Word Count & Reading Time -->
                    <div class="answer-meta" id="answerMeta" style="display:none;">
                        <span id="wordCount"></span> • <span id="readTime"></span>
                    </div>
                    
                    <!-- Action Buttons -->
                    <div class="answer-actions" id="answerActions" style="display:none;">
                        <button id="copyBtn" class="btn-action">📋 Copy</button>
                        <button id="pdfBtn" class="btn-action">📄 PDF</button>
                    </div>
                </div>

                <!-- Error -->
                <div id="error" class="card error-card" style="display: none;">
                    <p id="errorMessage"></p>
                </div>
            </main>
        </div>

        <footer>
            <p>Gemma 4 Challenge • <a href="https://github.com/siyalkhan494-dotcom/snapsolve-ai" target="_blank">GitHub</a></p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
