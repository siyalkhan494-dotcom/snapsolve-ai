<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapSolve AI - Study Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>🎓 SnapSolve AI</h1>
            <p class="subtitle">Your AI Study Assistant — Powered by Gemma 4</p>
        </header>

        <!-- Input Section -->
        <div class="card">
            <div class="input-group">
                <label for="subject">Subject:</label>
                <select id="subject">
                    <option value="general">General Knowledge</option>
                    <option value="math">Mathematics</option>
                    <option value="physics">Physics</option>
                    <option value="english">English</option>
                </select>
            </div>

            <div class="input-group">
                <label for="question">Your Question:</label>
                <textarea 
                    id="question" 
                    placeholder="Type your question here...&#10;&#10;Example: What is photosynthesis?&#10;Example: Solve for x: 2x + 5 = 15&#10;Example: Explain Newton's third law"
                    rows="5"
                ></textarea>
            </div>

            <div class="button-group">
                <button id="askBtn" class="btn btn-primary">
                    🔍 Explain in Detail
                </button>
                <button id="shortBtn" class="btn btn-secondary">
                    ⚡ Short Answer
                </button>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loading" class="card loading-card" style="display: none;">
            <div class="spinner"></div>
            <p>Gemma 4 is thinking...</p>
        </div>

        <!-- Result Section -->
        <div id="result" class="card result-card" style="display: none;">
            <div class="result-header">
                <h2>📝 Answer</h2>
                <span id="modeBadge" class="badge"></span>
            </div>
            <div id="answerContent" class="answer-content"></div>
            <div class="result-footer">
                <span id="subjectBadge" class="badge"></span>
                <span class="model-info">Powered by Gemma 4</span>
            </div>
        </div>

        <!-- Error Section -->
        <div id="error" class="card error-card" style="display: none;">
            <p id="errorMessage"></p>
        </div>

        <!-- Footer -->
        <footer>
            <p>Built for the <a href="https://dev.to/challenges/gemma4" target="_blank">DEV Gemma 4 Challenge</a></p>
            <p>Using Google's Gemma 4 model via AI Studio</p>
        </footer>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
